<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f5f0"><title>训练手记</title><style>
:root{--ink:#292724;--wine:#762d43;--muted:#69655e;--line:#e2dfd7;--paper:#f7f5f0}

.session+.session{margin-top:9px;border-top:1px solid #ffffff38;padding-top:10px}.session+.session h2{font-size:19px}.condition{font-size:13px;color:#f7e7e9;max-width:95%}.hero{padding:17px 20px}.hero summary{min-height:34px}.hero:before{opacity:.55}header{padding-block:8px}.filter,.pager,.tabs,.week{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:8px 0}.tabs{justify-content:flex-start;flex-wrap:wrap}.filter select{max-width:72%;min-height:40px;color:var(--wine);background:white;border:1px solid var(--line);border-radius:9px;padding:4px 10px;font:inherit}.tabs button,.week button{padding:5px 9px}.chosen{background:#f1e3e8;font-weight:bold}.week button{flex:1;padding:5px 0}.pager button:disabled{color:#aaa}.row b{min-width:0;overflow-wrap:anywhere}.row span{text-align:right}.hero+.section{margin-top:14px}.recovery-pair{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:8px;padding-top:8px}.recovery-pair>section,.recovery-pair>details{padding:0 12px;min-width:0}.recovery-pair>:last-child{border-left:1px solid var(--line)}.recovery-pair b{display:block;font-size:clamp(15px,4vw,20px);line-height:1.3;color:var(--ink)}.recovery-pair summary{display:block;min-height:44px}.recovery-pair summary small:after{content:" ▾";color:var(--wine)}.recovery-pair details[open] summary small:after{content:" ▴"}.metrics:has(.recovery-pair){padding:9px 0}.heading:has(+.hero){margin-bottom:10px}.hero{padding:13px 16px}#view:has(.hero) .section{margin:12px 0 5px}.week-calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));padding:5px}.cal-day{display:grid;justify-items:center;align-content:center;gap:1px;padding:4px 0;border-radius:9px;color:var(--ink)}.cal-day b{font-size:19px}.cal-day span{min-height:15px;font-size:10px;color:var(--muted)}.cal-day[aria-current=date]{box-shadow:inset 0 0 0 1px var(--wine)}.cal-day[aria-expanded=true]{background:var(--wine);color:white}.cal-day[aria-expanded=true] :is(small,span){color:white}.cal-detail{border-top:1px solid var(--line);padding:10px 14px}.cal-detail small{display:block;margin-top:7px}.cal-detail p{margin:2px 0}.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:0 6px;border-bottom:1px solid var(--line)}.cal-nav button{padding:0 10px;font-size:13px}.training-filters{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) minmax(0,1fr);gap:5px;margin-bottom:10px}.training-filter{position:relative;min-width:0}.training-filter summary{display:grid;align-content:center;min-height:50px;padding:4px 17px 4px 8px;background:#fffefa;border:1px solid var(--line);border-radius:9px;list-style:none}.training-filter summary::-webkit-details-marker{display:none}.training-filter summary:after{content:"▾";position:absolute;right:6px;top:18px;font-size:11px}.training-filter summary b{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.training-filter[open] summary{border-color:var(--wine)}.training-filter .filter-menu{position:absolute;top:calc(100% + 3px);left:0;z-index:3;width:max-content;min-width:100%;max-width:85vw;max-height:45vh;overflow:auto;background:#fffefa;border:1px solid var(--line);border-radius:9px;box-shadow:0 5px 16px #36262a22}.training-filter:last-child .filter-menu{left:auto;right:0}.filter-menu button{display:block;text-align:left;width:100%;padding:5px 12px;font-size:14px}.filter-menu button[aria-pressed=true]{background:#f1e3e8;font-weight:700}.hero.summary-carousel{display:flex;overflow-x:auto;padding:0;scroll-snap-type:x mandatory;overscroll-behavior-x:contain}.summary-carousel>section{flex:0 0 100%;min-width:0;padding:13px 16px;scroll-snap-align:start;scroll-snap-stop:always}.threshold-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.threshold-pair article{padding:12px}.threshold-pair article:first-child{background:#faf2f4}.threshold-pair h2{font-size:16px}.threshold-pair p{font-weight:650}.threshold-plot svg text{font-size:10px;fill:var(--muted)}.threshold-plot svg g{cursor:pointer}.spec-tabs{display:flex;overflow:auto;gap:4px;margin:8px 0}.spec-tabs button{flex:1 0 auto;padding:4px 7px;border-radius:8px;font-size:13px}.spec-filters,.spec-pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px 8px;margin:6px 0}.spec-filters label{font-size:12px;color:var(--muted)}.spec-filters select,.spec-filters input{display:block;width:100%;min-height:38px;margin:2px 0;padding:4px;border:1px solid var(--line);border-radius:7px;background:white;color:var(--ink);font:inherit;font-size:14px}.spec-chart{margin:8px 0}.spec-chart svg text{font-size:10px;fill:var(--muted)}.spec-chart svg g{cursor:pointer}.spec-chart small span{margin-right:6px}.recent-performance{margin:4px 0}.spec-pair article{padding:10px}.spec-pair h2{font-size:15px}
.spec-tabs{display:grid;grid-template-columns:max-content repeat(4,minmax(0,1fr));gap:2px;overflow:visible}
.spec-tabs button{min-width:0;padding-inline:4px;white-space:nowrap}
.spec-filters label{min-width:0}
.spec-chart svg,.threshold-plot svg{display:block}
.spec-chart svg text,.threshold-plot svg text{font-size:11px}
@media(max-width:354px){
 .spec-tabs{grid-template-columns:repeat(3,minmax(0,1fr));gap:2px 4px}
 .spec-tabs button{min-height:36px}
}
@media(max-width:380px){
 .spec-filters:has([data-menu="spec-newer"]){grid-template-columns:1fr}
 .spec-filters:has([data-menu="spec-newer"]) label{display:grid;grid-template-columns:4.5em minmax(0,1fr);align-items:center}
}
.pr-grid,.library-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin:8px 0}.pr-tile,.library-tiles section,.pr-history{background:#fffefa;border:1px solid var(--line);border-radius:10px;padding:10px;text-align:left}.pr-tile b,.library-tiles b{display:block;font-size:19px;color:var(--ink)}.pr-tile em{display:block;font-size:12px;font-style:normal}.pr-history{grid-column:1/-1}.pr-tile[aria-expanded=true]{border-color:var(--wine);background:#faf2f4}.book-toc details details{padding:7px 0;border-top:1px solid var(--line)}.book-toc details h3{margin-top:10px;font-size:15px}#view article>details+details{margin-top:7px}.long-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin:9px 0 12px}.long-stats div{padding:6px;background:#f6f2f1;border-radius:7px}.long-stats b{display:block;font-size:clamp(13px,3.5vw,16px);font-variant-numeric:tabular-nums}.long-heading{margin:8px 0 3px;font-size:16px}.long-values{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px;font-variant-numeric:tabular-nums}.long-values th,.long-values td{padding:5px 2px;text-align:right}.long-values th:first-child{text-align:left;color:var(--muted);font-weight:normal}.long-values thead th{font-size:12px}.long-values tbody tr:nth-child(odd){background:#f8f5f4}.long-values+details{margin:5px 0 12px}.training-filter[open]{z-index:5}.training-filter[open]>summary:after{content:"▴"}.spec-filters>.training-filter:nth-child(odd) .filter-menu{left:0;right:auto}.spec-filters>.training-filter:nth-child(even) .filter-menu{left:auto;right:0}.training-filter .filter-menu button{white-space:normal;overflow-wrap:anywhere}
.ability-special{padding:10px 12px}
.ability-special .spec-filters{margin:0 0 5px;gap:4px 6px}
.ability-special .training-filter summary{min-height:44px;padding-block:3px}
.ability-special .training-filter summary:after{top:14px}
.ability-special .spec-filters>label{display:grid;align-content:center}
.ability-special .spec-filters input{min-width:0;min-height:30px;margin:0}
.ability-special .spec-chart{margin:7px 0}
.ability-special .spec-chart>b,.ability-special .spec-chart>small{display:block}
.ability-special>p{font-size:13px;margin:5px 0}
.spec-details summary{min-height:36px;display:list-item;align-content:center;font-weight:600}
.spec-details ul{margin:0;padding:0;list-style:none}
.spec-details li{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:8px;padding:5px 2px;font-size:13px;line-height:1.45}
.spec-details li:nth-child(odd){background:#f8f5f4}
.spec-details time{color:var(--muted);font-variant-numeric:tabular-nums}

.health-trend .coverage{display:block;margin:3px 0;color:var(--muted)}
.health-trend .health-day>summary{display:flex;gap:8px;align-items:center;min-height:36px;padding:3px 0;font-size:13px;font-weight:normal}
.health-day>summary:before{content:"▸";color:var(--wine)}
.health-day[open]>summary:before{content:"▾"}
.health-day time{white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.health-day p{margin:4px 0;font-size:13px}
@media(min-width:350px){.library-tiles:has(>section:nth-child(6)){grid-template-columns:repeat(3,minmax(0,1fr))}}

.route-map{display:block;width:100%;max-height:380px;object-fit:contain;border-radius:9px;background:#f7f5f1;margin:8px 0}
.sleep-axis{display:flex;justify-content:space-between;margin:8px 0 4px 48px}
.night-line{display:flex;align-items:center;width:100%;gap:8px;min-height:19px;padding:0 2px;text-align:left;font-size:12px;color:var(--ink)}
.night-line time{width:40px;flex:none}.night-line span{position:relative;flex:1;height:16px}
.night-line i{position:absolute;top:4px;height:8px;background:#5e998b;border-radius:3px}
.night-line[aria-pressed=true]{background:#f4e9ed}.night-line[aria-pressed=true] i{background:var(--wine)}
.night-line.week-start{margin-top:5px}.night-note{margin-top:8px;padding:8px;background:#f8f2f3}
.phone-footprint{margin:12px 0;padding:12px;border-radius:14px;background:#202725;color:#f5f8f3;min-width:0}.phone-footprint-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.phone-footprint h3{color:inherit;margin:0}.phone-footprint small{color:#c7cfc8}.phone-footprint-head b{color:#c4dd76;font-size:18px}.phone-footprint>svg{display:block;width:100%;height:auto;max-height:300px}.phone-footprint path{stroke:#202725;stroke-width:.7}.phone-footprint path[data-province]{cursor:pointer}.phone-footprint .active-province{stroke:white;stroke-width:2}.province-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.province-chips button{border:1px solid #58625d;border-radius:7px;padding:5px 8px;background:#303936;color:#e8ede8;font-size:12px}.province-chips button[aria-pressed=true]{background:#c3da83;color:#172018;border-color:#c3da83}
