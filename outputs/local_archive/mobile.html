.health-trend .coverage{display:block;margin:3px 0;color:var(--muted)}

.sleep-axis{display:flex;justify-content:space-between;margin:8px 0 4px 48px}
.night-line{display:flex;align-items:center;width:100%;gap:8px;min-height:19px;padding:0 2px;text-align:left;font-size:12px;color:var(--ink)}
.night-line time{width:40px;flex:none}.night-line span{position:relative;flex:1;height:16px}
.night-line i{position:absolute;top:4px;height:8px;background:#5e998b;border-radius:3px}
.night-line[aria-pressed=true]{background:#f4e9ed}.night-line[aria-pressed=true] i{background:var(--wine)}
.night-line.week-start{margin-top:5px}.night-note{margin-top:8px;padding:8px;background:#f8f2f3}
.phone-footprint{margin:12px 0;padding:12px;border-radius:14px;background:#202725;color:#f5f8f3;min-width:0}.phone-footprint-head{display:flex;align-items:center;justify-content:space-between;gap:8px}.phone-footprint h3{color:inherit;margin:0}.phone-footprint small{color:#c7cfc8}.phone-footprint-head b{color:#c4dd76;font-size:18px}.phone-footprint>svg{display:block;width:100%;height:auto;max-height:300px}.phone-footprint path{stroke:#202725;stroke-width:.7}.phone-footprint path[data-province]{cursor:pointer}.phone-footprint .active-province{stroke:white;stroke-width:2}.province-chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.province-chips button{border:1px solid #58625d;border-radius:7px;padding:5px 8px;background:#303936;color:#e8ede8;font-size:12px}.province-chips button[aria-pressed=true]{background:#c3da83;color:#172018;border-color:#c3da83}
.daily-strength{margin:16px 0;padding-block:12px;border-block:1px solid var(--line)}
.daily-strength h2{margin:0 0 6px;font-size:17px}.daily-strength details{font-size:13px;margin:4px 0 8px}

/* poster-style:start */
.run-poster{width:min(420px,calc(100% - 22px));box-sizing:border-box;max-height:92dvh;overflow:auto;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink)}

.poster-top h2{margin:0;font-size:19px}.run-poster button,.poster-choice select{border:1px solid var(--line);background:white;color:var(--ink);padding:8px 12px;border-radius:8px;font:inherit}
.poster-choice{font-size:14px;margin:10px 0}.poster-choice select{max-width:75%}
.poster-preview{min-height:100px;display:grid;place-items:center}.poster-preview img{display:block;max-height:54dvh;max-width:100%;border-radius:5px}
.run-poster [hidden]{display:none}.poster-actions{justify-content:flex-start;margin:10px 0 4px}.poster-actions button:first-child{background:var(--wine);color:white}.run-poster button:disabled{opacity:.5}
.run-poster p{font-size:13px;margin:4px 0}.run-poster p:empty{display:none}.run-poster small{color:var(--muted)}

.poster-photo{display:grid;gap:5px;margin:8px 0;font-size:14px}.poster-photo input{max-width:100%}
.poster-fields{margin:8px 0 10px;padding:4px 0;border:0;min-width:0;font-size:13px}.poster-fields legend{color:var(--muted)}
.poster-fields div{display:flex;gap:5px;flex-wrap:wrap}.poster-fields label{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:6px;padding:5px 7px}.poster-fields input{accent-color:var(--wine);margin:0;width:15px;height:15px}.poster-fields label:has(:checked){background:#f7edf0;color:var(--wine)}

.stage-journey{margin:12px 0 4px;color:inherit}.stage-journey [hidden]{display:none!important}
.journey-nav{display:flex;gap:4px;align-items:center;border-bottom:1px solid var(--line,#e1dcd6);margin-bottom:14px}
.journey-nav button{appearance:none;background:transparent;color:inherit;opacity:.72;font:inherit;font-size:.94rem;padding:9px 18px;min-height:42px;border:0;border-bottom:3px solid transparent;border-radius:0;cursor:pointer}
.journey-nav button[aria-pressed=true]{color:var(--wine,#862946);border-bottom-color:currentColor;opacity:1;font-weight:700}
